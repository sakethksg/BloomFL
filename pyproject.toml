[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloomfl"
version = "0.1.0"
description = "Decentralized Edge Intelligence using Flower + Gossip Learning"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "flwr>=1.21.0",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "zeroconf>=0.132.0",
    "cryptography>=42.0.0",
    "psutil>=5.9.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
bloomfl-node = "bloomfl.__main__:main"
bloomfl-sim = "evaluation.benchmark:main"

[tool.setuptools.packages.find]
where = ["src", "."]
exclude = ["tests*", "docker*", "proto*", "scripts*", "results*", "*.egg-info*"]

[tool.setuptools.package-dir]
"bloomfl" = "src/bloomfl"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 60
log_cli = true
log_cli_level = "INFO"
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks tests that require real network sockets",
    "unit: marks pure-unit tests with no I/O",
]
